name: Deploy customer-order-lookup Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/customer-order-lookup/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-customer-order-lookup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy customer-order-lookup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy customer-order-lookup \
            --project-ref ksellpcaecuihxjxsolr \
            --no-verify-jwt \
            --yes
