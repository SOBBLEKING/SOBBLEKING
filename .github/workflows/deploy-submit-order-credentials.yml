name: Deploy submit-order-credentials Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/submit-order-credentials/**'
      - '.github/workflows/deploy-submit-order-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy submit-order-credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy submit-order-credentials \
            --project-ref ksellpcaecuihxjxsolr \
            --no-verify-jwt \
            --yes
